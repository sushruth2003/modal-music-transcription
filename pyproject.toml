[project]
name = "modal-music-transcription"
version = "0.1.0"
description = "Durable MuScriptor music transcription on Modal"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
keywords = ["audio", "midi", "modal", "music-transcription", "muscriptor"]
dependencies = [
    "fastapi>=0.116,<1",
    "modal>=1.5.5,<2",
    "python-multipart>=0.0.20,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
